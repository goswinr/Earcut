name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
           dotnet-version: '10.x'

      - name: Restore .NET tools (Fable)
        run: dotnet tool restore

      - name: Build .NET
        run: dotnet build

      - name: Run tests .NET
        run: dotnet fsi Test/test.fsx

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.x'

      - name: Build fable
        run: dotnet fable --noCache

      - name: Run tests JS
        run: node Test/test.js